name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Estrai il progetto
        run: |
          mkdir work
          unzip -q ./*.zip -d work
          P=$(dirname "$(find work -name build.gradle | head -n 1)")
          echo "PROJECT=$P" >> "$GITHUB_ENV"
      - name: Compila
        run: |
          cd "$PROJECT"
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Riassunto errori
        if: failure()
        run: |
          {
            echo '## Errori di compilazione'
            echo '```'
            grep -n -E -A4 'error:|What went wrong|Caused by' build.log | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Salva il .jar
        uses: actions/upload-artifact@v4
        with:
          name: iron-man-jar
          path: ${{ env.PROJECT }}/build/libs/iron-man-*.jar
      - name: Salva il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
